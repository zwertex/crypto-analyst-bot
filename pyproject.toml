[project]
name = "crypto-analyst-bot"
version = "0.1.0"
description = "Telegram bot for in-depth crypto analysis with long/short signals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13.0,<4.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "respx>=0.21.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
# RUF001/2/3 flag Cyrillic lookalikes; the bot UI is intentionally Russian.
# UP042 wants StrEnum (Python 3.11+); we keep `(str, Enum)` for clarity.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
